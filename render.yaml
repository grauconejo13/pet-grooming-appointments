services:
  - type: web
    name: pet-grooming-api
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/pet-grooming-api-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
