services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pet_grooming
      POSTGRES_USER: pet_grooming
      POSTGRES_PASSWORD: pet_grooming
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet_grooming -d pet_grooming"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

